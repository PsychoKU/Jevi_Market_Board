name: board

on:
  schedule:
    - cron: '*/15 * * * *'        # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
    inputs:
      force:
        description: 'Markets to refresh now (us,kr,jp or all)'
        default: ''
      full:
        description: 'Full refresh (universe, history, estimates)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['content/**', 'site/index.html', 'pipeline/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      built: ${{ steps.run.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore cached data
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            site/data
          key: board-${{ github.run_id }}
          restore-keys: board-
      - name: Collect and build
        id: run
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "${{ github.event_name }}" = "push" ]; then FORCE=all; fi
          ARGS=""
          [ -n "$FORCE" ] && ARGS="--force $FORCE"
          [ "${{ github.event.inputs.full }}" = "true" ] && ARGS="$ARGS --full"
          python pipeline/run.py $ARGS
      - name: Save cached data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            site/data
          key: board-${{ github.run_id }}
      - name: Commit digest for the daily commentary
        if: steps.run.outputs.built == '1'
        run: |
          git config user.name "board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest
          if ! git diff --cached --quiet; then
            git commit -m "digest $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" && git pull --rebase -q && git push -q || true
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.built == '1'
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.built == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
