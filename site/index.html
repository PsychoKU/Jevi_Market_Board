function cls(v){return !fin(v)||v===0?"flat":v>0?"up":"dn"}
function pct(v,d=2,plus=true){if(!fin(v))return"—";return(plus&&v>0?"+":"")+v.toFixed(d)+"%"}
function nfmt(v,d=0){if(!fin(v))return"—";return v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function px(v){const k=MK[S.m];if(!fin(v))return"—";if(S.m==="us")return"$"+nfmt(v,v<10?2:2);return nfmt(v,v<100&&S.m==="jp"?1:0)}
function cap(v){if(!fin(v))return"—";if(S.m==="us"){if(v>=1e6)return"$"+(v/1e6).toFixed(2)+"T";if(v>=1e3)return"$"+(v/1e3).toFixed(1)+"B";return"$"+nfmt(v)+"M"}if(v>=1e4)return(v/1e4).toFixed(v>=1e5?1:2)+"조";return nfmt(v)+"억"}
function tov(v){if(!fin(v))return"—";if(S.m==="us"){if(v>=1e3)return"$"+(v/1e3).toFixed(1)+"B";return"$"+nfmt(v,0)+"M"}if(v>=1e4)return(v/1e4).toFixed(2)+"조";return nfmt(v,v<10?1:0)+"억"}
function med(a){const b=a.filter(fin).sort((x,y)=>x-y);if(!b.length)return null;const i=b.length>>1;return b.length%2?b[i]:(b[i-1]+b[i])/2}

/* ---------- data ---------- */
const PK="__PACK_KEY__";
async function unpack(b64){
  const bin=atob(b64.trim()),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i)^PK.charCodeAt(i%PK.length);
  const st=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(st).text());
}
async function fetchData(m){
  if(PK.startsWith("__")){const r=await fetch("data/"+m+".json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
  const r=await fetch("data/"+m+".txt");if(!r.ok)throw new Error("HTTP "+r.status);return unpack(await r.text());
}
function prep(D){
  const C=D.cols;D.stocks=D.rows.map(a=>{const o={};C.forEach((c,i)=>o[c]=a[i]);return o});delete D.rows;
  D.by=new Map(D.stocks.map(s=>[s.code,s]));
  D.secList=[...new Set(D.stocks.map(s=>s.sec))];return D;
}
async function load(m){
  if(S.cache[m])return S.cache[m];
  const D=prep(await fetchData(m));S.cache[m]=D;return D;
}
/* live refresh: re-read the data file every 3 minutes; redraw only when the pipeline produced a newer build */
let busy=false;
async function poll(){
  if(busy||document.hidden||!PK.startsWith("__"))return;busy=true;
  try{const r=await fetch("data/meta.json?t="+Date.now(),{cache:"no-store"});const M=await r.json();
    for(const m of Object.keys(S.cache)){if(M[m]&&M[m]>S.cache[m].meta.built){delete S.cache[m];if(m===S.m){const D=await load(m);if(S.m!==m)continue;S.D=D;const y=window.scrollY;renderShell();if(!document.querySelector(".drawer")&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))render();window.scrollTo({top:y})}}}
  }catch(e){}finally{busy=false}
}
setInterval(poll,180000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
function upColor(){return getComputedStyle(document.documentElement).getPropertyValue("--rise").trim()}
function dnColor(){return getComputedStyle(document.documentElement).getPropertyValue("--fall").trim()}
function heat(v,scale){const c=v>=0?upColor():dnColor();const a=Math.min(1,Math.abs(v)/scale);return `color-mix(in oklab, ${c} ${Math.round(18+a*72)}%, var(--heat0))`}

function toggleWatch(code){const w=watch();w.has(code)?w.delete(code):w.add(code);store("board.watch."+S.m,[...w]);return w.has(code)}
function autoReason(s,secStat){
  const out=[];
  const ss=secStat&&secStat.get(s.sec);
  if(ss&&ss.wchg>0.6&&s.chg>0)out.push(["업종",`${s.sec} 업종 동반 상승 (업종 ${pct(ss.wchg)}, 상승 ${ss.up}/${ss.n})`]);
  else if(ss&&ss.wchg<-0.6&&s.chg<0)out.push(["업종",`${s.sec} 업종 동반 하락 (업종 ${pct(ss.wchg)})`]);
  if(fin(s.vr)&&s.vr>=3)out.push(["수급",`거래량 3개월 평균의 ${s.vr.toFixed(1)}배`]);
  if(s.nh)out.push(["추세","52주 신고가 경신"]);
  if(fin(s.fh)&&s.fh<-50&&s.chg>5)out.push(["반등",`고점 대비 ${s.fh.toFixed(0)}% 구간에서 반등`]);
  return out;
}
function reasonsFor(s,secStat){const r=(S.D.reasons&&S.D.reasons[s.code])||[];return r.concat(autoReason(s,secStat)).slice(0,2)}
function reasonHtml(list){return list.length?list.map(([t,x])=>`<span class="reason"><span class="tagk">${esc(t)}</span>${esc(x)}</span>`).join(""):`<span class="reason" style="color:var(--muted)">뚜렷한 뉴스·공시 확인 안 됨</span>`}
function secStats(){
  if(S.D._ss)return S.D._ss;
  const m=new Map();
  for(const s of S.D.stocks){let o=m.get(s.sec);if(!o){o={sec:s.sec,n:0,cap:0,w:0,w4:0,w52:0,up:0,dn:0,nh:0,nl:0,a2:0,a2n:0,to:0,chgs:[]};m.set(s.sec,o)}
    o.n++;const c=s.mcap||0;o.cap+=c;o.w+=c*(s.chg||0);o.w4+=c*(s.r4w||0);o.w52+=c*(s.c52||0);if(s.chg>0)o.up++;else if(s.chg<0)o.dn++;o.nh+=s.nh;o.nl+=s.nl;if(fin(s.a200)){o.a2n++;if(s.a200>0)o.a2++}o.to+=s.to||0;o.chgs.push(s.chg)}
  for(const o of m.values()){o.wchg=o.cap?o.w/o.cap:0;o.w4c=o.cap?o.w4/o.cap:0;o.w52c=o.cap?o.w52/o.cap:0;o.med=med(o.chgs);o.a2p=o.a2n?o.a2/o.a2n*100:null}
  return S.D._ss=m;
}

/* ---------- charts ---------- */
function lineChart(pts,{prev=null,w=760,h=230,fmtX,area=true}={}){
  if(!pts||pts.length<2)return'<div class="empty">차트 데이터가 없습니다.</div>';
  const ys=pts.map(p=>p[1]);let lo=Math.min(...ys),hi=Math.max(...ys);if(prev!=null){lo=Math.min(lo,prev);hi=Math.max(hi,prev)}
  const pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;const L=8,R=58,T=10,B=22;
  const x=i=>L+i/(pts.length-1)*(w-L-R),y=v=>T+(hi-v)/(hi-lo)*(h-T-B);
  const last=ys[ys.length-1],base=prev??ys[0],col=last>=base?"var(--rise)":"var(--fall)";
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(p[1]).toFixed(1)).join("");
  const G=h>420?6:4;let g="";for(let k=0;k<=G;k++){const v=lo+(hi-lo)*k/G;g+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${w-R+6}" y="${y(v)+3}">${nfmt(v,v<100?2:0)}</text>`}
  let xt="";const n=pts.length,step=Math.max(1,Math.floor(n/6));for(let i=0;i<n;i+=step)xt+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${fmtX(pts[i][0])}</text>`;
  const pl=prev!=null?`<line x1="${L}" x2="${w-R}" y1="${y(prev)}" y2="${y(prev)}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${w-R+6}" y="${y(prev)-4}" style="fill:var(--ink2)">전일</text>`:"";
  const ar=area?`<path d="${d}L${x(n-1)},${h-B}L${x(0)},${h-B}Z" fill="${col}" opacity=".08"/>`:"";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="지수 차트">${g}${pl}${ar}<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${x(n-1)}" cy="${y(last)}" r="3" fill="${col}"/>${xt}</svg>`;
}
const TZF={};function tzTime(t){const z={jp:"Asia/Tokyo",kr:"Asia/Seoul",us:"America/New_York"}[S.m];const f=TZF[z]||(TZF[z]=new Intl.DateTimeFormat("en-GB",{timeZone:z,hour:"2-digit",minute:"2-digit",hour12:false}));return f.format(new Date(t*1000))}
function ymd(t){const d=new Date(t*1000);return String(d.getUTCFullYear()).slice(2)+"."+String(d.getUTCMonth()+1).padStart(2,"0")}
function trendChart(T){
  const w=760,h=230,L=36,R=36,Tp=10,B=22,n=T.dates.length;
  const mx=Math.max(...T.nh,...T.nl,10),mid=Tp+(h-Tp-B)/2,sc=(h-Tp-B)/2/mx;const bw=(w-L-R)/n;
  let bars="";T.dates.forEach((d,i)=>{const xx=L+i*bw;bars+=`<rect x="${xx.toFixed(1)}" y="${(mid-T.nh[i]*sc).toFixed(1)}" width="${Math.max(1,bw-.6).toFixed(1)}" height="${(T.nh[i]*sc).toFixed(1)}" fill="var(--rise)" opacity=".75"/><rect x="${xx.toFixed(1)}" y="${mid}" width="${Math.max(1,bw-.6).toFixed(1)}" height="${(T.nl[i]*sc).toFixed(1)}" fill="var(--fall)" opacity=".75"/>`});
  const yA=v=>Tp+(100-v)/100*(h-Tp-B);const ln=T.ab.map((v,i)=>v==null?"":(i&&T.ab[i-1]!=null?"L":"M")+(L+i*bw+bw/2).toFixed(1)+","+yA(v).toFixed(1)).join("");
  let xt="";for(let i=0;i<n;i+=Math.floor(n/5))xt+=`<text x="${L+i*bw}" y="${h-6}">${T.dates[i].slice(2,7).replace("-",".")}</text>`;
  return `<div class="shc"><svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="52주 신고가·신저가 추이">
  <line x1="${L}" x2="${w-R}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>
  <text x="2" y="${Tp+8}">${mx}</text><text x="2" y="${h-B}">${mx}</text>
  <text x="${w-R+4}" y="${yA(100)+8}">100%</text><text x="${w-R+4}" y="${yA(50)+3}">50%</text><text x="${w-R+4}" y="${yA(0)}">0%</text>
  ${bars}<path d="${ln}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${xt}</svg></div>
  <div class="note">빨강(위) = 신고가 종목 수, 파랑(아래) = 신저가 종목 수, 선 = 200일 이동평균선 위에 있는 종목 비율(오른쪽 축). 종가 기준으로 직전 250거래일과 비교했습니다.</div>`;
}

function vIdeas(){
  const D=S.D,I=D.ideas;
  const card=(it)=>{const s=ideaStats(it.codes);const dots=Array.from({length:5},(_,i)=>`<i class="${i<it.strength?"on":""}"></i>`).join("");
    return `<article class="card idea${it.kind==="guess"?" guess":""}">
      <h3>${esc(it.title)} ${it.kind==="guess"?'<span class="pill guess">Claude 추정</span>':'<span class="pill hot">진행 중</span>'}</h3>

/* ---------- 3. sector ---------- */
function squarify(items,x,y,w,h){
  const out=[];const total=items.reduce((a,b)=>a+b.v,0);if(!total)return out;
  const sc=w*h/total;let rest=items.map(i=>({...i,a:i.v*sc}));
  function worst(row,side){const s=row.reduce((a,b)=>a+b.a,0);let mx=0;for(const r of row){const q=Math.max(side*side*r.a/(s*s),s*s/(side*side*r.a));if(q>mx)mx=q}return mx}
  while(rest.length){const side=Math.min(w,h);let row=[rest[0]],i=1;while(i<rest.length&&worst([...row,rest[i]],side)<=worst(row,side)){row.push(rest[i]);i++}
    const s=row.reduce((a,b)=>a+b.a,0);
    if(w>=h){const cw=s/h;let cy=y;for(const r of row){const rh=r.a/cw;out.push({...r,x,y:cy,w:cw,h:rh});cy+=rh}x+=cw;w-=cw}
    else{const rh=s/w;let cx=x;for(const r of row){const cw=r.a/rh;out.push({...r,x:cx,y,w:cw,h:rh});cx+=cw}y+=rh;h-=rh}
    rest=rest.slice(i)}
  return out;
}

}
function flowSeries(F){
  if(!F.series)return"";const s=F.series,w=760,h=200,L=8,R=58,T=10,B=22,n=s.dates.length;
  const keys=Object.keys(s.data);const cum={};keys.forEach(k=>{let c=0;cum[k]=s.data[k].map(v=>c+=v)});
  const all=keys.flatMap(k=>cum[k]);const lo=Math.min(0,...all),hi=Math.max(0,...all);
  const x=i=>L+i/(n-1)*(w-L-R),y=v=>T+(hi-v)/(hi-lo||1)*(h-T-B);

  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<text x="${w-R+6}" y="${y(v)+3}">${nfmt(v/1e4,1)}조</text>`}

  let xt="";for(let i=0;i<n;i+=Math.floor(n/5))xt+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${s.dates[i].slice(5).replace("-",".")}</text>`;

function multiLine(series,{w=760,h=220,fmtX=ymd,unit=""}={}){
  const all=series.flatMap(s=>s.pts.map(p=>p[1])).filter(fin);if(!all.length)return'<div class="empty">데이터가 없습니다.</div>';
  let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
  const L=20,R=58,T=10,B=22;const t0=Math.min(...series.map(s=>s.pts[0][0])),t1=Math.max(...series.map(s=>s.pts[s.pts.length-1][0]));
  const x=t=>L+(t-t0)/(t1-t0||1)*(w-L-R),y=v=>T+(hi-v)/(hi-lo)*(h-T-B);
  let g="";for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${w-R+6}" y="${y(v)+3}">${nfmt(v,Math.abs(hi)<100?1:0)}${unit}</text>`}
  let xt="";for(let k=0;k<=5;k++){const t=t0+(t1-t0)*k/5;xt+=`<text x="${x(t)}" y="${h-6}" text-anchor="middle">${fmtX(t)}</text>`}
  const ls=series.map(s=>`<path d="${s.pts.filter(p=>fin(p[1])).map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+","+y(p[1]).toFixed(1)).join("")}" fill="none" stroke="${s.c}" stroke-width="${s.wd||1.5}" ${s.dash?'stroke-dasharray="4 3"':""}/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}${ls}${xt}</svg><div class="chips" style="font-size:12px">${series.map(s=>`<span><span style="display:inline-block;width:12px;height:3px;background:${s.c};vertical-align:middle"></span> ${esc(s.n)}</span>`).join(" · ")}</div>`;
}
function oiChart(oi,{spot,mp,cw,pw,w=760,h=240,dec=0}){

  const mx=Math.max(1,...oi.map(r=>Math.max(r[1],r[2])));const L=26,R=26,T=12,B=26,mid=T+(h-T-B)/2,sc=(h-T-B)/2/mx;
  const k0=oi[0][0],k1=oi[oi.length-1][0],x=k=>L+(k-k0)/(k1-k0||1)*(w-L-R);const bw=Math.max(1.5,(w-L-R)/oi.length*.8);
  let b="";for(const r of oi){const xx=x(r[0])-bw/2;b+=`<rect x="${xx.toFixed(1)}" y="${(mid-r[1]*sc).toFixed(1)}" width="${bw.toFixed(1)}" height="${(r[1]*sc).toFixed(1)}" fill="var(--rise)" opacity=".8"><title>${r[0]} 콜 ${nfmt(r[1])}</title></rect><rect x="${xx.toFixed(1)}" y="${mid}" width="${bw.toFixed(1)}" height="${(r[2]*sc).toFixed(1)}" fill="var(--fall)" opacity=".8"><title>${r[0]} 풋 ${nfmt(r[2])}</title></rect>`}

   ${hold.length?`<section class="card"><h2>대량보유 보고</h2><ul class="ev">${hold.map(i=>`<li><span class="d">${esc(i.d)}</span><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.holder)} ${fin(i.a)?i.a.toFixed(2)+"%":""}</a></li>`).join("")}</ul></section>`:""}
   ${news.length?`<section class="card"><h2>관련 뉴스</h2><ul class="ev">${news.map(i=>`<li><span class="d">${esc(i.t)}</span><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></li>`).join("")}</ul></section>`:""}
   <section class="card"><h2>외부 링크</h2><div class="links">${links(s).map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join("")}</div></section>
  </aside>`;
  const close=()=>{host.innerHTML="";document.removeEventListener("keydown",onK)};const onK=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",onK);$("#scrim").addEventListener("click",close);$("#dClose").addEventListener("click",close);
  $("#dStar").addEventListener("click",()=>{const on=toggleWatch(code);$("#dStar").textContent=on?"★ 관심종목":"☆ 관심종목"});
  $("#drw").focus();
}
